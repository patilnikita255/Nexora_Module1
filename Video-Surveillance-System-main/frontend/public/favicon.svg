<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="16" fill="#0f172a"/>
  <!-- Camera lens outer ring (cyan glow) -->
  <circle cx="16" cy="16" r="10" stroke="#22d3ee" stroke-width="2" fill="none"/>
  <!-- Camera lens inner -->
  <circle cx="16" cy="16" r="5.5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Iris dot -->
  <circle cx="16" cy="16" r="2.5" fill="#22d3ee"/>
  <!-- Lens glint -->
  <circle cx="13.5" cy="13.5" r="1" fill="white" opacity="0.4"/>
  <!-- Scan arc top-left -->
  <path d="M 8.5 8.5 L 5 5" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Scan arc top-right -->
  <path d="M 23.5 8.5 L 27 5" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Status dot (red alert indicator) -->
  <circle cx="25" cy="8" r="2.5" fill="#f87171"/>
</svg>
